<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>竞彩足球篮球赛程及赛果</title>
<style>
:root{
  --bg:#f3f7f4; --bar:#198647; --card:#fff; --card2:#f5f8f5;
  --ink:#18241d; --sub:#718078; --red:#d34a3c; --blue:#3274d9; --gray:#8a948e;
  --amber:#d9820b; --line:#e2ebe5;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:linear-gradient(180deg,#eaf3ed 0,var(--bg) 280px);color:var(--ink);min-height:100vh;padding-bottom:32px}
.top{background:linear-gradient(135deg,#106b38,#22a456);color:#fff;text-align:center;padding:18px 16px 16px;position:sticky;top:0;z-index:20;box-shadow:0 5px 18px rgba(17,85,46,.2)}
.top h1{font-size:20px;font-weight:700;letter-spacing:1.5px}
.top p{font-size:11.5px;line-height:1.6;opacity:.86;margin-top:5px}
.top .bar-row{margin-top:11px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
#btnRefresh{background:#fff;color:#14773e;border:0;border-radius:999px;padding:7px 17px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 3px 10px rgba(0,0,0,.12);transition:transform .18s,box-shadow .18s}
#btnRefresh:hover{box-shadow:0 4px 13px rgba(0,0,0,.17);transform:translateY(-1px)}
#btnRefresh:disabled{opacity:.6;transform:none}
#updStatus{font-size:11px;opacity:.9}
/* 月份分组 */
#list{max-width:860px;margin:0 auto;padding:0 12px}
.day{margin-top:14px}
.day-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#e4f1e8;color:#237446;border:1px solid #d5e7da;border-radius:12px;box-shadow:0 2px 8px rgba(33,78,48,.04);cursor:pointer}
.day-head .d{font-size:14.5px;font-weight:700}
.day-head .cnt{margin-left:auto;font-size:11px;padding:2px 8px;background:rgba(255,255,255,.7);border-radius:999px}
.day-head .arrow{font-size:11px;transition:transform .2s}
.day.collapsed .arrow{transform:rotate(-90deg)}
.day-body{padding:0 2px}
/* 卡片 */
.item{display:flex;margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 5px 18px rgba(30,70,43,.07)}
.lg{width:34px;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:inset -1px 0 rgba(255,255,255,.25)}
.lg span{writing-mode:vertical-rl;letter-spacing:3px;font-size:12px;font-weight:700;color:#fff}
.main{flex:1;min-width:0;padding:12px 12px 11px}
.match-top{display:flex;align-items:center;gap:10px}
.no{width:64px;flex:none;text-align:center;padding:5px 2px;background:#f6f9f6;border:1px solid #e7eee8;border-radius:10px}
.no .wk{font-size:10.5px;color:var(--sub)}
.no .num{font-size:19.5px;font-weight:800;color:var(--red);line-height:1.15}
.no .tm{font-size:10px;color:var(--sub);line-height:1.35;margin-top:2px}
.no .dt{font-size:9.5px;color:var(--sub);line-height:1.3;margin-top:2px;white-space:nowrap}
.teams{flex:1;min-width:0}
.team-line{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:15px;font-weight:600}
.team-line .t{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end}
.team-line .t .nm{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.team-line .t.away .nm{text-align:left}
/* 主/客标记 */
.team-line .hc{font-style:normal;font-size:9px;font-weight:600;color:#68766d;background:#eef3ef;border:1px solid #dfe8e1;border-radius:4px;padding:1px 4px;margin-right:5px;vertical-align:1px;flex:none}
.team-line .t.away .hc{margin-right:0;margin-left:5px}
.team-line .t.away{justify-content:flex-start;text-align:right}
/* 队徽 */
.tl{flex:none;width:19px;height:19px;border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:#f1f5f2;border:1px solid #e7eee8;align-self:center}
.tl img{width:100%;height:100%;object-fit:contain;display:block}
.tl-fallback{font-size:9px;font-weight:700;color:#fff;background:#93a89b;border-color:#93a89b}
.team-line .t .tl{margin-right:6px}
.team-line .t.away .tl{margin-right:0;margin-left:6px}
.team-line .sc{flex:none;font-weight:800;font-size:20px;min-width:58px;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.team-line>.sc{padding:7px 8px;background:#e9f6ed;border:1px solid #d3ead9;border-radius:10px}
.team-line .min{font-size:9px;font-weight:800;color:#d2402a;line-height:1.15;letter-spacing:0}
/* 比分与比赛分钟竖排 */
.team-line .sc-wrap{flex:none;min-width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:4px 8px 6px;background:#e9f6ed;border:1px solid #d3ead9;border-radius:10px}
.team-line .sc-wrap .sc{min-width:0;display:block}
.team-line .sc-odds{font-size:10px;font-weight:600;color:var(--sub);margin-top:1px}
.team-line .vs{flex:none;min-width:42px;color:#849189;background:#f0f4f1;border-radius:9px;padding:6px 0;font-size:12px;font-weight:700;text-align:center;letter-spacing:.5px}
.meta{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:6px;padding:0 2px;font-size:11px;color:var(--sub)}
.gl{color:var(--amber);font-weight:600}
.half{grid-column:2;color:var(--sub);text-align:center}
.crs-sp{color:var(--sub)}
.status-tag{grid-column:3;justify-self:end;margin-left:0;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:.2px}
.st-2{color:#197342;background:#e6f4eb}
.st-1{color:#ad6b09;background:#fff2dc}
.st-live{color:#fff;background:#df5145;box-shadow:0 2px 7px rgba(223,81,69,.22)}
.st-end{color:#647168;background:#edf1ee}
.st-0{color:var(--gray);background:#eef1ef}
/* 五列赛果 */
.res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:10px}
.res .cell{min-width:0;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card2);border:1px solid #e2ebe4;border-radius:9px;padding:7px 2px 6px;text-align:center}
.res .lab{min-height:23px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;font-size:9.5px;color:var(--sub);margin-bottom:3px;line-height:1.25;white-space:normal}
.res.has-gl .lab{min-height:28px}
.res .lab .ln{white-space:nowrap}
.res .val{font-size:16.5px;font-weight:800;line-height:1.2}
.res .sp{min-height:12px;font-size:10px;color:var(--sub);margin-top:4px}
.v-h{color:var(--red)}
.v-d{color:#5b6860}
.v-a{color:var(--blue)}
.v-na{color:#b4bdb6;font-weight:400}
/* 比分颜色 */
.v-sc{color:#147a3e}
.team-line .sc{color:#147a3e}
/* 让球数值：跟在“让球胜平负”标签后，小号橙色 */
.res .glv{display:inline-block;font-size:9.5px;font-weight:800;color:var(--amber);margin-left:2px;vertical-align:1px}
/* 总进球：橙色 */
.v-tg{color:var(--amber)}
/* 半全场胜平负：紫色 */
.v-hf{color:#7b3fb8}
.sport-switch{display:inline-flex;margin-top:11px;padding:3px;background:rgba(0,0,0,.14);border:1px solid rgba(255,255,255,.2);border-radius:999px}
.sport-tab{border:0;border-radius:999px;padding:6px 22px;background:transparent;color:rgba(255,255,255,.82);font:700 12.5px inherit;cursor:pointer}
.sport-tab.active{background:#fff;color:#14773e;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.basket-res .val{font-size:14px;overflow-wrap:anywhere}
.empty{margin:24px 0;padding:36px 16px;text-align:center;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:14px}
.foot{max-width:860px;margin:0 auto;padding:22px 16px;text-align:center;font-size:10.5px;color:#87928a;line-height:1.7}
@media(max-width:520px){
  .top{padding:14px 10px 12px}
  .top h1{font-size:17px}
  .top p{font-size:10.5px;line-height:1.55}
  .top .bar-row{margin-top:9px}
  #list{padding:0 8px}
  .day{margin-top:10px}
  .day-head{padding:10px 12px;border-radius:11px}
  .day-body{padding:0}
  .item{margin:8px 0;border-radius:12px}
  .lg{width:29px}
  .lg span{font-size:11px;letter-spacing:2px}
  .main{padding:10px 7px 9px}
  .match-top{gap:6px}
  .no{width:56px;padding:4px 1px;border-radius:8px}
  .no .num{font-size:18px}
  .no .dt{font-size:9px}
  .tl{width:17px;height:17px}
  .team-line{gap:4px;font-size:13px}
  .team-line .hc{font-size:8px;padding:1px 3px;margin-right:3px}
  .team-line .t.away .hc{margin-left:3px}
  .team-line .sc{font-size:18px;min-width:50px}
  .team-line>.sc{padding:6px 5px}
  .team-line .sc-wrap{min-width:50px;padding:4px 5px 5px}
  .team-line .vs{min-width:32px;padding:5px 0;font-size:11px}
  .meta{margin-top:5px;font-size:10px}
  .status-tag{font-size:9.5px;padding:2px 7px}
  .res{gap:3px;margin-top:8px}
  .res .cell{min-height:69px;padding:6px 1px 5px;border-radius:7px}
  .res .lab{min-height:22px;font-size:8.5px}
  .res.has-gl .lab{min-height:26px}
  .res .val{font-size:14.5px}
  .res .sp{font-size:9px}
  .res .glv{font-size:8.5px}
  .sport-tab{padding:5px 20px;font-size:12px}
  .basket-res .val{font-size:11.5px}
  .foot{padding:18px 14px;font-size:10px}
}
</style>
</head>

const CN={H:'胜',D:'平',A:'负'};
const HF={HH:'胜胜',HD:'胜平',HA:'胜负',DH:'平胜',DD:'平平',DA:'平负',AH:'负胜',AD:'负平',AA:'负负'};
function parseScore(s){
  if(!s||s==='取消'||s==='无效场次'||s==='--'||!String(s).includes(':')) return null;
  const [h,a]=String(s).split(':').map(Number);
  if(isNaN(h)||isNaN(a)||h<0||a<0) return null;
  return [h,a];
}
function flag(h,a){return h>a?'H':h===a?'D':'A';}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// 在线记录 -> 21 字段行；赔率先继承快照
function calcRes(full, half, gls){
  let hda='--',rh='--',goals='--',ff='--';
  const fs=parseScore(full);
  if(fs){
    const [fh,fa]=fs;
    hda=CN[flag(fh,fa)];
    const gl=parseInt(gls)||0;
    rh=CN[flag(fh+gl,fa)];
    const t=fh+fa; goals=t<=6?String(t):'7+';
    const hs=parseScore(half);
    if(hs) ff=HF[flag(hs[0],hs[1])+flag(fh,fa)]||'--';
  }
  return [hda,rh,goals,ff];
}

function deriveRow(rec, snap, tmap, lv){
  let full=rec.sectionsNo999, half=rec.sectionsNo1;
  if(lv){ if(!full&&lv.full) full=lv.full; if(!half&&lv.half) half=lv.half; }
  let hda='--',rh='--',goals='--',ff='--';
  const fs=parseScore(full);
  if(fs){
    const [fh,fa]=fs;
    hda=CN[flag(fh,fa)];
    const gl=parseInt(rec.goalLine)||0;
    rh=CN[flag(fh+gl,fa)];
    const t=fh+fa; goals=t<=6?String(t):'7+';
    const hs=parseScore(half);
    if(hs) ff=HF[flag(hs[0],hs[1])+flag(fh,fa)]||'--';
  }
  const s=snap||[];
  // 开赛时间：优先本次赛程接口，其次快照里保存的
  const kk=rec.matchDate+'|'+rec.matchNumStr;
  const info=tmap&&tmap[kk];
  const tm=(lv&&lv.t)||(info&&info.t)||s[21]||'';
  const kickDate=(info&&info.d)||rec.matchDate;
  // 状态：已过开赛时间但未结算 → 进行中
  let status=rec.matchResultStatus;
  if(status==='1'&&tm){
    const kick=new Date(kickDate+'T'+tm+':00+08:00');
    if(Date.now()>kick.getTime()) status='L';
  }
  // 比分直播：5=直播中 6=直播结束 4=未开播 11=已完成
  if(lv&&lv.st){
    if(lv.st==='5') status='L';
    else if(lv.st==='6') status='E';
    else if(lv.st==='4') status='1';
  }
  const minute=(status==='L'||status==='E')?(lv&&lv.minute||''):'';
  return [
    rec.matchDate, rec.matchNumStr, rec.leagueNameAbbr, rec.homeTeam, rec.awayTeam, rec.goalLine||'',
    half||'--', full||'--', hda, rh, goals, ff, status,
    rec.h||'', rec.d||'', rec.a||'',
    s[16]||'', s[17]||'', s[18]||'', s[19]||'', s[20]||'', tm, minute
  ];
}

// 排序：先按真实开赛时间倒序（最新在前），同一时间再按场次号倒序
// 注意不能用“周二/周三”这类中文串比较，跨日场次（周二凌晨 vs 周三凌晨）会错位
function rowCode(m){ const c=String(m[1]||'').match(/(\d+)$/); return c?Number(c[1]):0; }
const WK_ORD={'周日':0,'周一':1,'周二':2,'周三':3,'周四':4,'周五':5,'周六':6};
function rowWk(m){ return WK_ORD[String(m[1]||'').slice(0,2)] ?? 0; }
function rowTs(m){
  const d=m[23]||m[0]||'';
  const t=/^\d{1,2}:\d{2}$/.test(m[21]||'')?m[21]:'00:00';
  if(!d) return 0;
  const ts=new Date(d+'T'+t+':00+08:00').getTime();
  return isNaN(ts)?0:ts;
}
function sortRows(a){
  a.sort((x,y)=>{
    const tx=rowTs(x), ty=rowTs(y);
    if(tx!==ty) return ty-tx;          // 真实开赛时间新的在前
    const wx=rowWk(x), wy=rowWk(y);
    if(wx!==wy) return wy-wx;          // 同一时间戳时按比赛日先后（周二晚于周一）
    return rowCode(y)-rowCode(x);      // 再按场次号倒序
  });
}

function renderAll(){

  else data.sort((a,b)=>a.date===b.date?String(a.num).localeCompare(String(b.num),'zh-CN'):(a.date<b.date?1:-1));
  const groups=[], idx={};
  data.forEach(m=>{
    const date=sport==='football'?m[0]:m.date, k=String(date||'').slice(0,7);
    if(!idx[k]){idx[k]=[];groups.push(k);} idx[k].push(m);
  });
  listEl.innerHTML='';
  if(!groups.length){
    listEl.innerHTML='<div class="empty">暂无篮球数据，正在加载或请点击上方刷新重试</div>';
    return;
  }
  const card=sport==='football'?matchCard:basketballCard, OPEN_DEFAULT=1;
  groups.forEach((k,gi)=>{
    const day=document.createElement('div');
    day.className='day'+(gi<OPEN_DEFAULT?'':' collapsed');
    const body=document.createElement('div'); body.className='day-body';
    let rendered=false;
    const render=()=>{ if(!rendered){ body.innerHTML=idx[k].map(card).join(''); rendered=true; } };
    if(gi<OPEN_DEFAULT) render(); else body.style.display='none';
    const label=`${k.split('-')[0]}年${Number(k.split('-')[1])}月`;

    day.querySelector('.day-head').onclick=()=>{

      body.style.display=collapsed?'none':'';
    };
    listEl.appendChild(day);
  });

// 篮球比分为“客队-主队”，让分以主队为基准。
function parseBasketScore(s){
  if(!s||s==='取消'||s==='无效场次'||s==='--') return null;
  const parts=String(s).trim().split(/[-:：]/);
  if(parts.length!==2) return null;
  const pa=String(parts[0]).trim(), ph=String(parts[1]).trim();
  if(!pa||!ph||!/^\d+$/.test(pa)||!/^\d+$/.test(ph)) return null;   // 过滤 "-"、"88-" 之类的占位值
  const away=Number(pa), home=Number(ph);
  if(!Number.isFinite(away)||!Number.isFinite(home)||away<0||home<0) return null;
  return [away,home];
}

function basketPool(pool,type,score,settled){
  const p=pool||{};
  const out={result:p.combinationDesc||'--',odds:p.winOdds||'',line:p.goalLine||'',note:p.resultStatus||'',single:p.single==1,quote:false};
  if(out.note){ out.result='--'; out.odds=''; return out; }
  if(out.result!=='--'||!score||!settled) return out;
  const [away,home]=score, diff=home-away;
  if(type==='mnl') out.result=diff>0?'主胜':diff<0?'主负':'--';
  if(type==='hdc'&&out.line!==''){
    const adjusted=home+Number(out.line);
    if(Number.isFinite(adjusted)) out.result=adjusted>away?'让分主胜':adjusted<away?'让分主负':'--';
  }
  if(type==='hilo'&&out.line!==''){
    const line=Number(out.line);
    if(Number.isFinite(line)) out.result=home+away>line?'大':home+away<line?'小':'--';
  }
  if(type==='wnm'&&diff!==0){
    const n=Math.abs(diff), band=n<=5?'1-5':n<=10?'6-10':n<=15?'11-15':n<=20?'16-20':n<=25?'21-25':'26+';
    out.result=(diff>0?'主胜':'客胜')+band;
  }
  return out;
}

function basketFixturePool(pool,type,poolStatus){
  const p=pool||{}, hasPool=Object.keys(p).length>0;
  const out={result:'--',odds:'',line:p.goalLine||'',note:'',single:false,quote:true};
  const status=String(poolStatus||'');
  if(!hasPool||(status&&status!=='Selling')){
    out.note=status==='Closed'?'已停售':'未开售';
    return out;
  }
  if(type==='mnl'||type==='hdc'){
    if(p.h||p.a){ out.result='主 '+(p.h||'--'); out.odds='客 '+(p.a||'--'); }
  }else if(type==='hilo'){
    if(p.h||p.l){ out.result='大 '+(p.h||'--'); out.odds='小 '+(p.l||'--'); }
  }else if(type==='wnm'&&(p.w1||p.l1)){
    out.result='主1-5 '+(p.w1||'--'); out.odds='客1-5 '+(p.l1||'--');
  }
  if(out.result==='--') out.note='未开售';
  return out;
}

function findBasketLive(m,liveList){
  if(m.matchId){
    const byId=liveList.find(v=>String(v.matchId)===String(m.matchId));
    if(byId) return byId;
  }
  const key=(m.home||'')+'|'+(m.away||''), base=m.playDate||m.date;
  return liveList.find(v=>{
    if(v.home+'|'+v.away!==key||!v.d||!base) return false;
    const diff=(new Date(v.d+'T00:00:00+08:00')-new Date(base+'T00:00:00+08:00'))/864e5;
    return Math.abs(diff)<=1;
  })||null;
}

function bkScoreVal(s){ return parseBasketScore(s)?String(s).trim().replace('：',':').replace('-',':'):''; }

function applyBasketLive(m,lv){
  if(!lv) return m;
  const lvScore=bkScoreVal(lv.full), curScore=bkScoreVal(m.full);
  // 直播中/刚结束的场次：一律采用直播接口的实时比分，避免被赛果接口的占位值挡住
  if(lvScore&&(lv.st==='5'||lv.st==='6'||!curScore)) m.full=lvScore;
  if((!m.half||m.half==='--')&&bkScoreVal(lv.half)) m.half=bkScoreVal(lv.half);
  if(lv.t) m.time=lv.t;
  if(!m.matchId&&lv.matchId) m.matchId=lv.matchId;
  if(!['0','2','3'].includes(String(m.status))){
    if(lv.st==='5') m.status='L';
    else if(lv.st==='6'||lv.st==='11') m.status='E';
    else if(lv.st==='4') m.status='1';
  }
  m.minute=(m.status==='L'||m.status==='E')?(lv.minute||''):'';
  return m;
}

function basketResultRow(rec,base,lv){
  const m=Object.assign({},base||{});
  m.date=rec.matchDate||m.date||'';
  m.num=rec.matchNumStr||m.num||'';
  m.league=rec.leagueNameAbbr||rec.leagueAbbName||m.league||'';
  m.home=rec.homeTeam||rec.homeTeamAbbName||m.home||'';
  m.away=rec.awayTeam||rec.awayTeamAbbName||m.away||'';
  m.playDate=rec.matchDate||m.playDate||m.date;
  m.matchId=rec.matchId||m.matchId||(lv&&lv.matchId)||'';
  m.full=bkScoreVal(rec.finalScore)||bkScoreVal(rec.sectionsNo999)||bkScoreVal(lv&&lv.full)||bkScoreVal(m.full)||'--';
  m.half=bkScoreVal(rec.sectionsNo1)||bkScoreVal(lv&&lv.half)||bkScoreVal(m.half)||'--';
  m.time=(lv&&lv.t)||m.time||'';
  m.status=String((rec.status??rec.matchResultStatus??m.status)??'');
  if(m.status==='1'&&!parseBasketScore(m.full)&&m.time&&Date.now()>new Date(m.playDate+'T'+m.time+':00+08:00').getTime()) m.status='L';
  const score=parseBasketScore(m.full), settled=m.status==='2'||m.status==='3';
  ['mnl','hdc','hilo','wnm'].forEach(type=>{
    const previous=(base&&base[type])||{}, raw=Object.assign({},rec[type]||{});
    if(!raw.goalLine&&previous.line) raw.goalLine=previous.line;
    if(!rec[type]&&previous.note) raw.resultStatus=previous.note;
    m[type]=basketPool(raw,type,score,settled);
  });
  m.fromResult=true;
  return applyBasketLive(m,lv);
}

function basketStatusHtml(m){
  const st=String(m.status??'');
  if(st==='0'||m.full==='取消'||m.full==='无效场次') return '<span class="status-tag st-0">取消/无效</span>';
  if(st==='L') return '<span class="status-tag st-live">直播中</span>';
  if(st==='E') return '<span class="status-tag st-end">直播结束</span>';
  if(st==='3') return '<span class="status-tag st-0">暂停兑奖</span>';
  if(st==='1'){
    const kick=m.playDate&&m.time?new Date(m.playDate+'T'+m.time+':00+08:00').getTime():0;
    if(kick&&Date.now()<kick){
      const text=m.saleStatus&&m.saleStatus!=='Selling'?'未开售':'未开赛';
      return '<span class="status-tag st-1">'+text+'</span>';
    }
    return '<span class="status-tag st-1">待开奖</span>';
  }
  return '<span class="status-tag st-2">已完成</span>';
}

async function refreshBasketball(){
  if(refreshing.basketball) return;
  refreshing.basketball=true;
  const btn=document.getElementById('btnRefresh'), st=document.getElementById('updStatus');
  if(currentSport==='basketball'){ btn.disabled=true; st.textContent='正在拉取篮球赛程、比分及赛果…'; }
  try{
    let resultError=false;
    const [online,live,fixtures]=await Promise.all([
      fetchBasketRecent().catch(()=>{resultError=true;return[];}),fetchBasketLive(),fetchBasketFixtures()
    ]);
    const rowMap={};
    basketRows.forEach(m=>rowMap[m.date+'|'+m.num]=m);
    fixtures.forEach(f=>{
      const key=f.date+'|'+f.num;
      if(!rowMap[key]||!rowMap[key].fromResult) rowMap[key]=f;
    });
    online.forEach(rec=>{
      const key=rec.matchDate+'|'+rec.matchNumStr, base=rowMap[key]||{};
      rowMap[key]=basketResultRow(rec,base,findBasketLive(base,live));
    });
    Object.values(rowMap).forEach(m=>applyBasketLive(m,findBasketLive(m,live)));
    basketRows=Object.values(rowMap);
    if(currentSport==='basketball'){
      renderAll();
      const now=new Date();
      st.textContent=resultError?'赛果暂不可用，已更新赛程与比分':`已更新 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }
  }catch(e){
    if(currentSport==='basketball'){ st.textContent='网络异常，显示已缓存篮球数据'; renderAll(); }
  }finally{
    refreshing.basketball=false;
    syncRefreshButton();
  }
}

function updateHeaderDate(){
  const el=document.getElementById('header-date');
  if(el) el.textContent=currentSport==='football'
    ?'2025-09-01 至 '+fmtDate(new Date())
    :fmtDate(new Date(Date.now()-10*864e5))+' 起 · 近期赛果与在售赛程';
}

function syncRefreshButton(){
  document.getElementById('btnRefresh').disabled=!!refreshing[currentSport];
}

async function refreshFootball(){
  if(refreshing.football) return;
  refreshing.football=true;
  const btn=document.getElementById('btnRefresh'), st=document.getElementById('updStatus');
  if(currentSport==='football'){ btn.disabled=true; st.textContent='正在拉取官方最新赛果…'; }
  try{
    const [online,liv,fx]=await Promise.all([fetchRecent(),fetchLive(),fetchFixtures()]);
    const tmap=fx.tmap;
    const snapMap={}; SNAPSHOT.forEach(r=>snapMap[r[0]+'|'+r[1]]=r);
    const rowMap={}; rows.forEach(r=>rowMap[r[0]+'|'+r[1]]=r);
    fx.rowsF.forEach(f=>{ const k=f[0]+'|'+f[1]; if(!rowMap[k]&&!snapMap[k]) rowMap[k]=f; });

    // 比分直播按「场次号 + 比赛日」匹配，允许业务日与比赛日跨 1 天
    const diffDay=(a,b)=>{ const d=(new Date(a+'T00:00:00+08:00')-new Date(b+'T00:00:00+08:00'))/864e5; return Math.abs(d); };
    const findLive=(row)=>{
      const key=(row[3]||'')+'|'+(row[4]||'');
      const base=row[23]||row[0];
      for(const k in liv){
        const v=liv[k];
        if(v.key!==key) continue;
        if(diffDay(v.d, base)<=1) return v;
      }
      return null;
    };

    const needDetail=[];
    online.forEach(rec=>{
      const key=rec.matchDate+'|'+rec.matchNumStr;
      const base=snapMap[key]||rowMap[key]||[];
      const lv=findLive(base.length?base:[rec.matchDate,'', '', rec.homeTeam||'', rec.awayTeam||'']);
      const row=deriveRow(rec, base, tmap, lv);
      rowMap[key]=row;
      if(rec.matchResultStatus==='2' && !row[16]) needDetail.push({matchId:rec.matchId, row});
    });

    // 未开赛/直播中但赛果接口还没吐出来的场次：用直播数据补卡
    Object.keys(rowMap).forEach(k=>{
      const row=rowMap[k];
      const lv=findLive(row);
      if(!lv) return;
      if(row[12]==='L'||row[12]==='E'||row[12]==='1'){
        if(lv.full&&row[7]==='--'){
          row[7]=lv.full; if(lv.half) row[6]=lv.half;
          const r=calcRes(lv.full, row[6], row[5]);
          row[8]=r[0]; row[9]=r[1]; row[10]=r[2]; row[11]=r[3];
        }
        if(lv.t) row[21]=lv.t;
        row[22]=(lv.st==='5'||lv.st==='6')?(lv.minute||''):'';
      }
    });

    rows=Object.values(rowMap);
    if(currentSport==='football'){
      renderAll();
      if(needDetail.length) st.textContent=`补取 ${needDetail.length} 场赔率…`;
    }
    await fillDetailSp(needDetail);
    if(currentSport==='football'){
      renderAll();
      const now=new Date();
      st.textContent=`已更新 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }
  }catch(e){
    if(currentSport==='football'){ st.textContent='网络异常，显示本地快照'; renderAll(); }
  }finally{
    refreshing.football=false;
    syncRefreshButton();
  }
}

function refresh(){
  updateHeaderDate();
  return currentSport==='basketball'?refreshBasketball():refreshFootball();
}

function setSport(sport){
  if(sport===currentSport) return;
  currentSport=sport;
  const basket=sport==='basketball';
  document.getElementById('pageTitle').textContent=basket?'竞彩篮球赛程及赛果':'竞彩足球赛程及赛果';
  document.getElementById('headerMarkets').textContent=basket?'终场比分 · 胜负 · 让分胜负 · 大小分 · 胜分差':'比分 · 胜平负 · 让球胜平负 · 总进球 · 半全场胜平负';
  document.getElementById('footNote').textContent=basket
    ?'篮球按左客队、右主队显示，比分为客队-主队；让分以主队为基准，大小分按两队总分计算。彩果与固定奖金以官方公布为准。'
    :'各玩法结果与赔率以中国竞彩网官方公布为准；"-" 表示该玩法官方未开售或暂未开奖。';
  document.title=basket?'竞彩篮球赛程及赛果':'竞彩足球赛程及赛果';
  ['Football','Basketball'].forEach(name=>{
    const active=(name==='Basketball')===basket, tab=document.getElementById('tab'+name);
    tab.classList.toggle('active',active);
    tab.setAttribute('aria-selected',String(active));
  });
  updateHeaderDate();
  renderAll();
  syncRefreshButton();
  document.getElementById('updStatus').textContent='加载中…';
  refresh();
}

// ===== 队徽自动补全 =====
// 源数据接口没有 CORS，浏览器需经公共代理读取；每 6 小时最多同步一次，新增球队写入本地缓存。
// 代理不可用时静默失败，继续用内嵌的 773 支球队映射 + 首字占位。
const LOGO_SYNC_KEY='jczq_logo_sync_v1';
const LOGO_PROXY=[
  p=>'https://api.allorigins.win/raw?url='+encodeURIComponent(p),
  p=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(p)
];
function loadLogoSync(){
  try{ const c=JSON.parse(localStorage.getItem(LOGO_SYNC_KEY)||'null'); if(c&&c.extra) Object.assign(LOGO_MAP,c.extra); return c||{at:0,extra:{}}; }
  catch(e){ return {at:0,extra:{}}; }
}
async function proxyJSON(path){
  for(const wrap of LOGO_PROXY){
    try{
      const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),8000);
      const r=await fetch(wrap('https://ljtzs.zhcvideo.com'+path),{signal:ctl.signal});
      clearTimeout(timer);
      if(!r.ok) continue;
      return JSON.parse(await r.text());
    }catch(e){}
  }
  return null;
}
async function autoSyncLogos(){
  const cache=loadLogoSync();
  if(Date.now()-(cache.at||0)<6*3600*1000) return;
  const dates=await proxyJSON('/index/footballmatch/dates');
  if(!dates||!dates.list||!dates.list.length) return;
  const extra=Object.assign({},cache.extra||{});
  let changed=false;
  for(const day of dates.list.slice(0,3)){
    const j=await proxyJSON('/index/footballmatch/data?date='+day);
    (j&&j.list||[]).forEach(m=>{
      [['home_name','home_icon'],['guest_name','guest_icon']].forEach(pair=>{
        const n=m[pair[0]], u=m[pair[1]];
        if(n&&u&&!LOGO_MAP[n]){ extra[n]=String(u).replace(LOGO_CDN,'').replace(/\.png$/,''); changed=true; }
      });
    });
  }
  Object.assign(LOGO_MAP,extra);
  try{ localStorage.setItem(LOGO_SYNC_KEY,JSON.stringify({at:Date.now(),extra:extra})); }catch(e){}
  if(changed&&currentSport==='football') renderAll();
}

renderAll();
updateHeaderDate();
refresh();
autoSyncLogos();
setInterval(()=>{if(!document.getElementById('btnRefresh').disabled) refresh();},60000);
document.getElementById('btnRefresh').onclick=refresh;
document.getElementById('tabFootball').onclick=()=>setSport('football');
document.getElementById('tabBasketball').onclick=()=>setSport('basketball');
</script>
